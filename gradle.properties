org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 代理（可选）。只有需要走代理才能访问 maven 的环境才取消注释 ——
# 写死在这里会让没有代理的人构建失败。建议放进 ~/.gradle/gradle.properties。
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=10809
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=10809

# 目标环境：MC 1.21.1 / NeoForge 21.1.228 / Java 21
minecraft_version=1.21.1
neo_version=21.1.228
java_version=21

mod_id=ftbqauto
mod_version=1.0.0
mod_group=dev.ftbqauto

# 与整合包 mods 目录里完全一致的版本
ftb_quests_version=2101.1.33
ftb_teams_version=2101.1.10
ftb_library_version=2101.1.35
architectury_version=13.0.8

# 玉（Jade）。版本号与整合包 mods 目录里的 jar 严格对齐。
# 走 Modrinth 的 maven，因为 Jade 没发布到 FTB / Architectury / NeoForge 的仓库。
jade_version=15.10.5+neoforge
