plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    // FTB Quests 及其依赖由整合包提供，这里只用于编译期取 API。
    // 版本与 E:\血族机械师 的 mods 目录严格对齐。
    // transitive = false：只要这几个 jar 本身的签名，不拉它们的传递依赖
    // （否则会顺着 ftb-library -> architectury -> ... 一路解析下去）。
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }

    // 玉（Jade）：只用于编译联动插件。没装 Jade 时我们的插件类不会被加载。
    compileOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            mod_id     : mod_id,
            mod_version: mod_version,
            mod_group  : mod_group,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_id,
                'Implementation-Version': mod_version,
        ])
    }
}

// 一键部署到整合包的 mods 目录。
// 目标路径不写死在这 —— 不然别人的构建会指向一个不存在的目录。
// 用法：gradlew deployToPack -Pdeploy_dir=<整合包 mods 目录>
// 也可以写进你本机的 ~/.gradle/gradle.properties（不会进仓库）。
tasks.register('deployToPack') {
    dependsOn tasks.named('jar')
    doLast {
        def target = findProperty('deploy_dir')
        if (!target) {
            println '未配置 deploy_dir，跳过部署。'
            println '用法：gradlew deployToPack -Pdeploy_dir=<整合包 mods 目录>'
            return
        }
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        copy {
            from jarFile
            into target
        }
        println "已部署 ${jarFile.name} → ${target}"
    }
}
